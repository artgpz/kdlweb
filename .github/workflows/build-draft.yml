name: Build draft content

on:
    push:
        branches:
            - pnpm
    pull_request:
        branches:
            - pnpm

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-22.04

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup PNPM
              uses: pnpm/setup@v3
              with:
                  version: 12
                  cache: true

            - name: Install dependencies
              run: |
                  pnpm ci

            - name: Restore image cache
              uses: actions/cache/restore@v6
              with:
                  path: _site/img
                  key: eleventy-images-${{ runner.os }}-${{ hashFiles('/docs/assets/images/**/*') }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      eleventy-images-${{ runner.os }}-

            - name: Build frontend
              run: |
                  pnpm run build --pathprefix 'kdlweb'

            - name: Save image cache
              uses: actions/cache/save@v6
              with:
                  path: _site/img
                  key: eleventy-images-${{ runner.os }}-${{ hashFiles('/docs/assets/images/**/*') }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site

            # - name: Deploy to GitHub pages
            #   if: github.ref == 'refs/heads/develop'
            #   uses: peaceiris/actions-gh-pages@v4
            #   with:
            #       publish_dir: ./frontend/_site
            #       github_token: ${{ secrets.GITHUB_TOKEN }}
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
