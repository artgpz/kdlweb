name: Sync projects

on:
    workflow_dispatch:
        inputs:
            payload:
                description: Pages CMS payload as JSON
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sync:
        runs-on: ubuntu-22.04

        permissions:
            contents: write
        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  persist-credentials: true
                  ref: ${{ github.head_ref }}

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup PNPM
              uses: pnpm/setup@v3
              with:
                  version: 12
                  cache: true

            - name: Install dependencies
              run: |
                  pnpm ci

            - name: Get env
              run: |
                  touch .env
                  echo CLICKUP_API_URL=${{ secrets.CLICKUP_API_URL }} >> .env
                  echo CLICKUP_API_KEY=${{ secrets.CLICKUP_API_KEY }} >> .env
                  echo CLICKUP_TEAM_ID=${{ secrets.CLICKUP_TEAM_ID }} >> .env

            - name: Sync project ids
              run: |
                  pnpm run cli --action=sync --dest='../../docs' --item-id=1004

            - uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  file_pattern: "/docs/projects.json"
                  commit_message: "ci: Sync projects index"
