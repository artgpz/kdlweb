name: Update content

on:
    workflow_dispatch:
        inputs:
            payload:
                description: Pages CMS payload as JSON
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    update:
        runs-on: ubuntu-22.04

        permissions:
            contents: write
        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  persist-credentials: true
                  ref: ${{ github.head_ref }}

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup PNPM
              uses: pnpm/setup@v3
              with:
                  version: 12
                  cache: true

            - name: Install dependencies
              run: |
                  pnpm ci

            - name: Get env
              run: |
                  touch apps/etl/.env
                  echo CLICKUP_API_URL=${{ secrets.CLICKUP_API_URL }} >> apps/etl/.env
                  echo CLICKUP_API_KEY=${{ secrets.CLICKUP_API_KEY }} >> apps/etl/.env
                  echo CLICKUP_TEAM_ID=${{ secrets.CLICKUP_TEAM_ID }} >> apps/etl/.env

            - name: Create and update project, orgs and people
              run: |
                  pnpm run cli --action=write-projects --dest=../../docs
                  pnpm run cli --action=write-orgs --dest=../../docs
                  pnpm run cli --action=write-people --dest=../../docs

            - uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  file_pattern: "docs/about/**/*.md docs/projects/*.md"
                  commit_message: "ci: Sync projects index"
