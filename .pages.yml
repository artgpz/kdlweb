media:
    - name: images
      label: Images
      input: docs/assets/images
      output: /assets/images
      rename: safe
      extensions: [png, jpg, webp, svg]
    - name: videos
      label: Videos
      input: docs/assets/videos
      output: /assets/videos
      rename: safe
      extensions: [mp4]
      # actions:
      #     - name: optimize-images
      #       label: Optimize images
      #       workflow: pages-cms-media-action.yml
content:
    - name: faqs
      label: FAQs
      type: collection
      path: docs/faqs
      format: yaml-frontmatter
      fields:
          - name: title
            label: Title
            type: string
          - name: order
            label: Order
            type: number
          - name: tags
            label: Tags
            type: string
            list: true
          - name: body
            label: Content
            type: rich-text

settings:
    content:
        merge: true
    commit:
        identity: app
        templates:
            create: "chore: Create {name} {filename}"
            update: "chore: Update {name} {filename}"
            delete: "chore: Delete {name} {filename}"
            rename: "chore: Rename {oldPath} -> {newPath}"
