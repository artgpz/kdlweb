media:
    - name: images
      label: Images
      input: docs/assets/images
      output: docs/assets/images
      rename: safe
      extensions: [png, jpg, webp]
      # actions:
      #     - name: optimize-images
      #       label: Optimize images
      #       workflow: pages-cms-media-action.yml
content:
    - name: blog
      label: Blog
      type: collection
      path: docs/blog
      format: yaml-frontmatter
      fields:
          - name: title
            type: string
          - name: subtitle
            type: string
          - name: excerpt
            type: string
          - name: tags
            type: string
            list: true
          - name: authors
            type: string
            list: true
          - name: date
            type: date
            default: ""
          - name: feature
            type: object
            fields:
                - name: title
                  type: string
                - name: description
                  type: rich-text
                - name: image
                  type: image
                  options:
                      path: docs/assets/images/blog
          - name: excerpt
            type: string
          - name: body
            type: rich-text
